services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pharmacy
      POSTGRES_USER: pharmacy
      POSTGRES_PASSWORD: pharmacy
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmacy -d pharmacy"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pharmacy-postgres:/var/lib/postgresql/data

  bot:
    build:
      context: .
      target: runtime
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pharmacy-postgres:
